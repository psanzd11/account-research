id: public_disclosure_v1
applies_to: company
metric: estimated_annual_revenue
unit: USD/year
output_type: range

description: >
  Skips heuristics for companies whose annual revenue (or sales / ARR) has
  been publicly disclosed in an SEC filing, earnings call, press release, or
  reputable third-party financial database. Renders a HIGH-confidence range
  drawn directly from the disclosed figure.

required_signals:
  - signal: disclosed_revenue_usd
    type: number
    description: A dollar amount explicitly tagged as revenue / sales / ARR
    source: ledger.evidence where source_type=sec_filing OR raw_quote matches "$X (million|billion) in (revenue|sales|ARR)"
    weight: 1.0

minimum_required_signals: 1

confidence_rule:
  - if: source_type == sec_filing
    confidence: high
  - else:
    confidence: high  # press releases with explicit revenue figures are still HIGH

caveat_template: >
  Based on disclosed financial figure of ${disclosed_revenue_usd}.

notes: |
  This recipe MUST run before saas_revenue_v1 / consulting_firm_revenue_v1 so
  that public companies short-circuit out of headcount-driven heuristics.
  Regex requires explicit "revenue|sales|ARR" keyword — TPV/processed-volume
  terms do not match.
